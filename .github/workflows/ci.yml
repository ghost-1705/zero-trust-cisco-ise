name: CI - Zero Trust Validation & Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/python/requirements.txt ]; then pip install -r scripts/python/requirements.txt; fi
          pip install flake8 pytest

      - name: Lint Code with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run Zero Trust Simulator Engine
        run: |
          python scripts/python/ise_mock_demo.py --export-csv ci_demo_report.csv
