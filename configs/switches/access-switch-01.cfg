! =============================================================================
! ACCESS SWITCH 01 CONFIGURATION
! Device    : Cisco Catalyst 2960-X / 3560
! Hostname  : SW-ACCESS-01
! Role      : Access Layer - Building A, Floor 1
! Uplink    : Gi0/24 to SW-CORE-01 Gi1/0/1
! Author    : Network Lab Team
! Date      : 2024
! Version   : IOS 15.2(2)E8 or later
! =============================================================================

service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
no ip http server
no ip http secure-server

hostname SW-ACCESS-01

!
banner motd ^
*******************************************************************************
*                        AUTHORIZED ACCESS ONLY                               *
*  This device is part of a Zero Trust 802.1X secured network.               *
*  All port authentication events are logged to Cisco ISE.                   *
*  Unauthorized access attempts will be reported and prosecuted.             *
*******************************************************************************
^
!

! --- Enable Secret & Local Fallback User ---
enable secret 9 $9$mL1LvuvzISmzXU$7mZkJqV1UoKaKa3EWJNuM7
username admin privilege 15 secret 9 $9$mL1LvuvzISmzXU$7mZkJqV1UoKaKa3EWJNuM7
username netops privilege 10 secret 9 $9$aB2CdEfGhIjKlMnO$pQrStUvW

! =============================================================================
! AAA CONFIGURATION
! =============================================================================
aaa new-model
!
! ISE RADIUS group
aaa group server radius ISE-RADIUS-SERVERS
 server name ISE-PRIMARY
 server name ISE-SECONDARY
 deadtime 5
!
! Authentication policies
aaa authentication login default local
aaa authentication login CONSOLE local
aaa authentication dot1x default group ISE-RADIUS-SERVERS
!
! Authorization policies
aaa authorization exec default local
aaa authorization network default group ISE-RADIUS-SERVERS
!
! Accounting policies
aaa accounting dot1x default start-stop group ISE-RADIUS-SERVERS
aaa accounting exec default start-stop group ISE-RADIUS-SERVERS
aaa accounting system default start-stop group ISE-RADIUS-SERVERS
!
! CoA (Change of Authorization) from ISE
aaa server radius dynamic-author
 client 192.168.1.100 server-key 7 ChangeMe_SharedSecret!
 client 192.168.1.101 server-key 7 ChangeMe_SharedSecret!
 auth-type any
!

! =============================================================================
! RADIUS SERVER DEFINITIONS
! =============================================================================
radius server ISE-PRIMARY
 address ipv4 192.168.1.100 auth-port 1812 acct-port 1813
 key 7 ChangeMe_SharedSecret!
 timeout 5
 retransmit 3
 automate-tester username radiustest idle-time 10
!
radius server ISE-SECONDARY
 address ipv4 192.168.1.101 auth-port 1812 acct-port 1813
 key 7 ChangeMe_SharedSecret!
 timeout 5
 retransmit 3
!

! RADIUS global parameters
ip radius source-interface Vlan100
radius-server attribute 6 on-for-login-auth
radius-server attribute 8 include-in-access-req
radius-server attribute 25 access-request include
radius-server attribute 31 mac format ietf upper-case
radius-server attribute 31 send nas-port-detail
radius-server dead-criteria time 5 tries 3
radius-server deadtime 5

! =============================================================================
! 802.1X GLOBAL SETTINGS
! =============================================================================
dot1x system-auth-control
dot1x critical eapol

! =============================================================================
! VLAN DEFINITIONS
! =============================================================================
vlan 10
 name EMPLOYEES
!
vlan 20
 name CONTRACTORS
!
vlan 30
 name IOT_DEVICES
!
vlan 40
 name GUEST
!
vlan 50
 name VOIP
!
vlan 99
 name QUARANTINE
!
vlan 100
 name MANAGEMENT
!

! =============================================================================
! MANAGEMENT SVI
! =============================================================================
interface Vlan100
 description MANAGEMENT_SVI
 ip address 192.168.100.11 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.100.1

! =============================================================================
! 802.1X ACCESS PORTS — Gi0/1 through Gi0/4
! Full 802.1X with MAB fallback, auth fail VLAN, no-response VLAN
! =============================================================================

interface GigabitEthernet0/1
 description ACCESS_PORT_PC_01
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 !
 ! 802.1X authentication settings
 authentication event fail action authorize vlan 99
 authentication event no-response action authorize vlan 99
 authentication event server dead action authorize vlan 10
 authentication event server dead action authorize voice
 authentication event server alive action reinitialize
 authentication host-mode multi-auth
 authentication open
 authentication order dot1x mab
 authentication priority dot1x mab
 authentication port-control auto
 authentication periodic
 authentication timer reauthenticate server
 authentication violation restrict
 !
 ! 802.1X supplicant role
 dot1x pae authenticator
 dot1x timeout quiet-period 10
 dot1x timeout tx-period 5
 dot1x timeout supp-timeout 30
 dot1x max-reauth-req 2
 !
 ! BPDU guard and PortFast
 spanning-tree portfast
 spanning-tree bpduguard enable
 !
 ! Storm control
 storm-control broadcast level 10.00
 storm-control multicast level 10.00
 storm-control action shutdown
 !
 no shutdown
!

interface GigabitEthernet0/2
 description ACCESS_PORT_PC_02
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 !
 authentication event fail action authorize vlan 99
 authentication event no-response action authorize vlan 99
 authentication event server dead action authorize vlan 10
 authentication event server dead action authorize voice
 authentication event server alive action reinitialize
 authentication host-mode multi-auth
 authentication open
 authentication order dot1x mab
 authentication priority dot1x mab
 authentication port-control auto
 authentication periodic
 authentication timer reauthenticate server
 authentication violation restrict
 !
 dot1x pae authenticator
 dot1x timeout quiet-period 10
 dot1x timeout tx-period 5
 dot1x timeout supp-timeout 30
 dot1x max-reauth-req 2
 !
 spanning-tree portfast
 spanning-tree bpduguard enable
 !
 storm-control broadcast level 10.00
 storm-control multicast level 10.00
 storm-control action shutdown
 !
 no shutdown
!

interface GigabitEthernet0/3
 description ACCESS_PORT_VOIP_PHONE_01
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 50
 switchport nonegotiate
 !
 ! Voice/data dual-host mode for IP Phone + PC
 authentication event fail action authorize vlan 99
 authentication event no-response action authorize vlan 99
 authentication event server dead action authorize vlan 10
 authentication event server dead action authorize voice
 authentication event server alive action reinitialize
 authentication host-mode multi-domain
 authentication open
 authentication order dot1x mab
 authentication priority dot1x mab
 authentication port-control auto
 authentication periodic
 authentication timer reauthenticate server
 authentication violation restrict
 !
 dot1x pae authenticator
 dot1x timeout quiet-period 10
 dot1x timeout tx-period 5
 dot1x timeout supp-timeout 30
 dot1x max-reauth-req 2
 !
 spanning-tree portfast
 spanning-tree bpduguard enable
 !
 storm-control broadcast level 10.00
 storm-control multicast level 10.00
 storm-control action shutdown
 !
 no shutdown
!

interface GigabitEthernet0/4
 description ACCESS_PORT_IOT_DEVICE_01
 switchport mode access
 switchport access vlan 30
 switchport nonegotiate
 !
 ! IoT device - MAB primary (no 802.1X supplicant expected)
 authentication event fail action authorize vlan 99
 authentication event no-response action authorize vlan 99
 authentication event server dead action authorize vlan 30
 authentication event server alive action reinitialize
 authentication host-mode single-host
 authentication open
 authentication order mab dot1x
 authentication priority mab dot1x
 authentication port-control auto
 authentication periodic
 authentication timer reauthenticate server
 authentication violation restrict
 !
 dot1x pae authenticator
 dot1x timeout quiet-period 10
 dot1x timeout tx-period 5
 dot1x timeout supp-timeout 30
 dot1x max-reauth-req 2
 !
 spanning-tree portfast
 spanning-tree bpduguard enable
 !
 storm-control broadcast level 10.00
 storm-control multicast level 10.00
 storm-control action shutdown
 !
 no shutdown
!

! =============================================================================
! UPLINK TRUNK TO CORE SWITCH
! =============================================================================
interface GigabitEthernet0/24
 description TRUNK_TO_SW-CORE-01_Gi1/0/1
 switchport mode trunk
 switchport trunk native vlan 100
 switchport trunk allowed vlan 10,20,30,40,50,99,100
 spanning-tree portfast trunk
 no shutdown
!

! =============================================================================
! DHCP SNOOPING
! =============================================================================
ip dhcp snooping
ip dhcp snooping vlan 10,20,30,40,50,99
no ip dhcp snooping information option
!
! Trust the uplink only
interface GigabitEthernet0/24
 ip dhcp snooping trust
!

! =============================================================================
! DYNAMIC ARP INSPECTION (DAI)
! =============================================================================
ip arp inspection vlan 10,20,30,40,50,99
!
! Trust the uplink only
interface GigabitEthernet0/24
 ip arp inspection trust
!

! =============================================================================
! PORT SECURITY (optional - can conflict with 802.1X multi-auth)
! Applied only to static servers, not 802.1X ports
! =============================================================================

! =============================================================================
! LOGGING
! =============================================================================
logging buffered 51200 informational
logging console warnings
logging host 192.168.1.100 transport udp port 514
logging source-interface Vlan100
logging trap informational
!

! =============================================================================
! NTP
! =============================================================================
ntp server 192.168.100.1 prefer
clock timezone EST -5 0
clock summer-time EDT recurring
!

! =============================================================================
! SNMP
! =============================================================================
snmp-server community ZeroTrustRO RO
snmp-server location "Building A - Floor 1 - IDF Closet 1A"
snmp-server contact "netops@lab.local"
snmp-server host 192.168.200.30 version 2c ZeroTrustRO
snmp-server enable traps dot1x
snmp-server enable traps mac-notification change
!

! =============================================================================
! SPANNING TREE
! =============================================================================
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!

! =============================================================================
! SSH & LINE CONFIG
! =============================================================================
ip domain-name lab.local
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
line con 0
 login authentication CONSOLE
 logging synchronous
 exec-timeout 10 0
!
line vty 0 15
 login authentication default
 transport input ssh
 exec-timeout 15 0
!

end
