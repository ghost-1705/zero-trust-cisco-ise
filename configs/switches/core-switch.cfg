! =============================================================================
! CORE SWITCH CONFIGURATION
! Device    : Cisco Catalyst 3850 / 3750 Series
! Hostname  : SW-CORE-01
! Role      : Core / Distribution Layer
! Site      : Campus Lab - Zero Trust Network
! Author    : Network Lab Team
! Date      : 2024
! Version   : IOS 15.2(4)E7 or later
! =============================================================================

! --- Basic System Settings ---
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
no ip http server
no ip http secure-server

hostname SW-CORE-01

! --- Enable L3 IP Routing ---
ip routing
ip multicast-routing

!
banner motd ^
*******************************************************************************
*                        AUTHORIZED ACCESS ONLY                               *
*  This system is restricted to authorized users for legitimate business      *
*  purposes only. Unauthorized access is a violation of company policy and    *
*  applicable laws. All activity is monitored and logged.                     *
*                                                                              *
*  If you are not an authorized user, disconnect NOW.                          *
*******************************************************************************
^
!

! --- Enable Secret & Local User ---
enable secret 9 $9$mL1LvuvzISmzXU$7mZkJqV1UoKaKa3EWJNuM7
username admin privilege 15 secret 9 $9$mL1LvuvzISmzXU$7mZkJqV1UoKaKa3EWJNuM7
username netops privilege 10 secret 9 $9$aB2CdEfGhIjKlMnO$pQrStUvW

! --- AAA New Model ---
aaa new-model
!
! ISE RADIUS Authentication
aaa group server radius ISE-RADIUS-SERVERS
 server name ISE-PRIMARY
 server name ISE-SECONDARY
 ip vrf forwarding Mgmt-vrf
 deadtime 5
!
aaa authentication login default local
aaa authentication login CONSOLE local
aaa authentication dot1x default group ISE-RADIUS-SERVERS
aaa authorization exec default local
aaa authorization network default group ISE-RADIUS-SERVERS
aaa accounting dot1x default start-stop group ISE-RADIUS-SERVERS
aaa accounting exec default start-stop group ISE-RADIUS-SERVERS
aaa accounting system default start-stop group ISE-RADIUS-SERVERS
!
aaa server radius dynamic-author
 client 192.168.1.100 server-key 7 ChangeMe_SharedSecret!
 client 192.168.1.101 server-key 7 ChangeMe_SharedSecret!
 auth-type any
!

! --- RADIUS Server Definitions ---
radius server ISE-PRIMARY
 address ipv4 192.168.1.100 auth-port 1812 acct-port 1813
 key 7 ChangeMe_SharedSecret!
 timeout 5
 retransmit 3
 automate-tester username radiustest idle-time 10
!
radius server ISE-SECONDARY
 address ipv4 192.168.1.101 auth-port 1812 acct-port 1813
 key 7 ChangeMe_SharedSecret!
 timeout 5
 retransmit 3
!

! --- RADIUS Global Parameters ---
ip radius source-interface Vlan100
radius-server attribute 6 on-for-login-auth
radius-server attribute 8 include-in-access-req
radius-server attribute 25 access-request include
radius-server attribute 31 mac format ietf upper-case
radius-server attribute 31 send nas-port-detail
radius-server dead-criteria time 5 tries 3
radius-server deadtime 5

! --- 802.1X Global Enable ---
dot1x system-auth-control
dot1x critical eapol

! --- VLANs ---
vlan 10
 name EMPLOYEES
!
vlan 20
 name CONTRACTORS
!
vlan 30
 name IOT_DEVICES
!
vlan 40
 name GUEST
!
vlan 50
 name VOIP
!
vlan 99
 name QUARANTINE
!
vlan 100
 name MANAGEMENT
!
vlan 200
 name SERVERS
!

! --- SVI Interfaces ---
interface Vlan10
 description EMPLOYEES_VLAN
 ip address 10.10.10.1 255.255.255.0
 ip helper-address 192.168.200.10
 ip access-group ACL_VLAN10_IN in
 no shutdown
!
interface Vlan20
 description CONTRACTORS_VLAN
 ip address 10.10.20.1 255.255.255.0
 ip helper-address 192.168.200.10
 ip access-group ACL_VLAN20_IN in
 no shutdown
!
interface Vlan30
 description IOT_DEVICES_VLAN
 ip address 10.10.30.1 255.255.255.0
 ip helper-address 192.168.200.10
 ip access-group ACL_VLAN30_IN in
 no shutdown
!
interface Vlan40
 description GUEST_VLAN
 ip address 10.10.40.1 255.255.255.0
 ip helper-address 192.168.200.10
 ip access-group ACL_VLAN40_IN in
 no shutdown
!
interface Vlan50
 description VOIP_VLAN
 ip address 10.10.50.1 255.255.255.0
 ip helper-address 192.168.200.10
 no shutdown
!
interface Vlan99
 description QUARANTINE_VLAN
 ip address 10.10.99.1 255.255.255.0
 ip access-group ACL_QUARANTINE in
 no shutdown
!
interface Vlan100
 description MANAGEMENT_VLAN
 ip address 192.168.100.1 255.255.255.0
 no shutdown
!
interface Vlan200
 description SERVERS_VLAN
 ip address 192.168.200.1 255.255.255.0
 no shutdown
!

! --- Trunk Uplinks to Access Switches ---
interface GigabitEthernet1/0/1
 description TRUNK_TO_SW-ACCESS-01
 switchport mode trunk
 switchport trunk native vlan 100
 switchport trunk allowed vlan 10,20,30,40,50,99,100,200
 spanning-tree portfast trunk
 no shutdown
!
interface GigabitEthernet1/0/2
 description TRUNK_TO_SW-ACCESS-02
 switchport mode trunk
 switchport trunk native vlan 100
 switchport trunk allowed vlan 10,20,30,40,50,99,100,200
 spanning-tree portfast trunk
 no shutdown
!
interface GigabitEthernet1/0/48
 description UPLINK_TO_FIREWALL_OR_ROUTER
 no switchport
 ip address 172.16.0.2 255.255.255.252
 no shutdown
!

! --- ISE / Server Links ---
interface GigabitEthernet1/0/40
 description SERVER_SEGMENT_ISE_AD
 switchport mode access
 switchport access vlan 200
 spanning-tree portfast
 no shutdown
!

! --- Access Control Lists ---
ip access-list extended ACL_VLAN10_IN
 remark Allow employees full LAN access
 permit ip 10.10.10.0 0.0.0.255 any
 deny   ip any any log
!
ip access-list extended ACL_VLAN20_IN
 remark Contractors - Internet and limited server access
 permit ip 10.10.20.0 0.0.0.255 192.168.200.0 0.0.0.255
 permit ip 10.10.20.0 0.0.0.255 host 8.8.8.8
 deny   ip 10.10.20.0 0.0.0.255 10.10.10.0 0.0.0.255 log
 permit ip 10.10.20.0 0.0.0.255 any
 deny   ip any any log
!
ip access-list extended ACL_VLAN30_IN
 remark IoT - restricted to dedicated server only
 permit udp 10.10.30.0 0.0.0.255 host 192.168.200.20 eq 1883
 permit tcp 10.10.30.0 0.0.0.255 host 192.168.200.20 eq 8883
 permit udp 10.10.30.0 0.0.0.255 host 192.168.200.10 eq 53
 deny   ip 10.10.30.0 0.0.0.255 10.0.0.0 0.255.255.255 log
 deny   ip 10.10.30.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 permit ip 10.10.30.0 0.0.0.255 any
!
ip access-list extended ACL_VLAN40_IN
 remark Guest - Internet only, deny all internal
 deny   ip 10.10.40.0 0.0.0.255 10.0.0.0 0.255.255.255 log
 deny   ip 10.10.40.0 0.0.0.255 172.16.0.0 0.15.255.255 log
 deny   ip 10.10.40.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 permit tcp 10.10.40.0 0.0.0.255 any eq 80
 permit tcp 10.10.40.0 0.0.0.255 any eq 443
 permit udp 10.10.40.0 0.0.0.255 any eq 53
 deny   ip any any log
!
ip access-list extended ACL_QUARANTINE
 remark Quarantine - allow DHCP, DNS, ISE only
 permit udp any any eq 67
 permit udp any any eq 68
 permit udp any host 192.168.200.10 eq 53
 permit tcp any host 192.168.1.100 eq 8443
 deny   ip any any log
!

! --- OSPF Routing ---
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface GigabitEthernet1/0/48
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.30.0 0.0.0.255 area 0
 network 10.10.40.0 0.0.0.255 area 0
 network 10.10.50.0 0.0.0.255 area 0
 network 10.10.99.0 0.0.0.255 area 0
 network 192.168.100.0 0.0.0.255 area 0
 network 192.168.200.0 0.0.0.255 area 0
 network 172.16.0.0 0.0.0.3 area 0
 default-information originate
!
ip route 0.0.0.0 0.0.0.0 172.16.0.1

! --- NTP Configuration ---
ntp server 192.168.200.10 prefer
ntp server pool.ntp.org
ntp update-calendar
clock timezone EST -5 0
clock summer-time EDT recurring
!

! --- Logging Configuration ---
logging buffered 51200 informational
logging console warnings
logging monitor informational
logging host 192.168.1.100 transport udp port 514
logging host 192.168.200.10
logging source-interface Vlan100
logging trap informational
!

! --- SNMP Configuration ---
snmp-server community ZeroTrustRO RO
snmp-server community ZeroTrustRW RW
snmp-server location "Campus Lab - Core Room"
snmp-server contact "netops@lab.local"
snmp-server host 192.168.200.30 version 2c ZeroTrustRO
snmp-server enable traps snmp authentication linkdown linkup
snmp-server enable traps dot1x
snmp-server enable traps mac-notification change
!

! --- Spanning Tree ---
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree vlan 10,20,30,40,50,99,100,200 priority 4096
!

! --- Line Console and VTY ---
line con 0
 login authentication CONSOLE
 logging synchronous
 exec-timeout 10 0
!
line vty 0 15
 login authentication default
 transport input ssh
 exec-timeout 15 0
!

! --- SSH Configuration ---
ip domain-name lab.local
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!

end
